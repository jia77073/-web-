<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>数学魔法课 | 两位数乘两位数(末尾有0)</title>
    <!-- Tailwind CSS CDN (v2.2 稳定版，满足玻璃蓝风格及快速布局) -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- React & ReactDOM & Babel -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <style>
        /* 补充自定义毛玻璃、圆角细节及儿童友好设计 (Tailwind基础上强化) */
        body {
            background: linear-gradient(145deg, #c0e0ff 0%, #a0c4ff 100%);
            font-family: 'Segoe UI', 'Comic Neue', 'Comic Neue', 'Comic Sans MS', 'Poppins', system-ui, sans-serif;
            min-height: 100vh;
            padding: 1rem;
        }
        /* 毛玻璃卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255,255,255,0.6);
            transition: all 0.2s ease;
        }
        .glass-card-container {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
        }
        .drag-card {
            transition: transform 0.08s linear;
            cursor: grab;
            user-select: none;
            touch-action: none;  /* 优化触摸拖拽 */
        }
        .drag-card:active {
            cursor: grabbing;
        }
        .drop-zone-active {
            background: rgba(96, 165, 250, 0.5);
            border: 3px solid #3b82f6;
            transform: scale(1.02);
        }
        /* 自定义可爱风格滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #88aaff;
            border-radius: 10px;
        }
        .btn-shine {
            transition: all 0.2s;
        }
        .btn-shine:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
<div id="root" class="max-w-6xl mx-auto w-full"></div>

<script type="text/babel">
    //  ---------- 两位数乘两位数（末尾有0）游戏组件 ----------
    const { useState, useEffect, useRef, useCallback } = React;

    // 生成随机整十数 (10,20...90)
    const generateTens = () => {
        const arr = [10,20,30,40,50,60,70,80,90];
        return arr[Math.floor(Math.random() * arr.length)];
    };

    // 根据两个乘数计算正确积
    const computeProduct = (num1, num2) => num1 * num2;

    // 生成一道全新题目 (末尾有0的两位数乘两位数)
    const generateNewQuestion = () => {
        const num1 = generateTens();
        const num2 = generateTens();
        const product = computeProduct(num1, num2);
        return { num1, num2, product };
    };

    // 生成答案选项（包含一个正确值 + 两个合理的干扰项）
    const generateAnswerOptions = (correctProduct) => {
        // 干扰项策略: ±100, ±200, 但不能重复且不应为负数，且尽量整百可爱
        let candidates = new Set();
        candidates.add(correctProduct);
        let offset = [100, 200, 300, 400, 500];
        for (let off of offset) {
            let candidate1 = correctProduct + off;
            let candidate2 = correctProduct - off;
            if (candidate1 > 0 && candidate1 <= 8100) candidates.add(candidate1);
            if (candidate2 > 0 && candidate2 <= 8100) candidates.add(candidate2);
            if (candidates.size >= 3) break;
        }
        // 确保至少有3个不同选项
        let options = Array.from(candidates);
        while (options.length < 3) {
            options.push(correctProduct + 100 * options.length);
        }
        // 随机抽取包含正确值在内的三个不同数值
        let shuffled = [...options];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        let selected = shuffled.slice(0, 3);
        if (!selected.includes(correctProduct)) {
            selected[0] = correctProduct;
        }
        // 再次打乱顺序让正确位置随机
        for (let i = selected.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [selected[i], selected[j]] = [selected[j], selected[i]];
        }
        return selected;
    };

    // 获取竖式展示文本 (末尾0简便步骤)
    const getVerticalFormat = (num1, num2, product) => {
        const zeroCount1 = num1.toString().split('').filter(ch => ch === '0').length;
        const zeroCount2 = num2.toString().split('').filter(ch => ch === '0').length;
        const leading1 = num1 / Math.pow(10, zeroCount1);
        const leading2 = num2 / Math.pow(10, zeroCount2);
        const midProd = leading1 * leading2;
        const totalZero = zeroCount1 + zeroCount2;
        return `     ${num1}\n   × ${num2}\n   ————————\n   ${midProd}${'0'.repeat(totalZero)}\n   ————————\n   ${product}`;
    };

    // 主游戏组件
    const MathGame = () => {
        // 题目数据
        const [question, setQuestion] = useState(() => generateNewQuestion());
        const [answerOptions, setAnswerOptions] = useState([]);
        // 游戏交互状态
        const [feedback, setFeedback] = useState("✨ 拖拽彩色卡片到蓝色放框里 ✨");
        const [score, setScore] = useState(0);
        const [showFormat, setShowFormat] = useState("horizontal"); // "horizontal" 或 "vertical"
        const [isDraggingActive, setIsDraggingActive] = useState(false);
        
        // 拖拽相关refs
        const dragCloneRef = useRef(null);
        const dragSourceRef = useRef(null);
        const dragValueRef = useRef(null);
        const startOffsetX = useRef(0);
        const startOffsetY = useRef(0);
        const isDraggingNow = useRef(false);
        const dropZoneRef = useRef(null);
        
        // 刷新题目 (换一题)
        const refreshQuestion = useCallback(() => {
            const newQ = generateNewQuestion();
            setQuestion(newQ);
            const newOpts = generateAnswerOptions(newQ.product);
            setAnswerOptions(newOpts);
            setFeedback("🎈 新题目出现！拖动正确的积到蓝色框里吧 🎈");
            // 移除任何高亮残余
            if (dropZoneRef.current) {
                dropZoneRef.current.classList.remove('drop-zone-active');
            }
        }, []);
        
        // 题目更新时重置答案选项 (当question变化时)
        useEffect(() => {
            const newOpts = generateAnswerOptions(question.product);
            setAnswerOptions(newOpts);
        }, [question]);
        
        // 处理配对正确时的逻辑
        const handleCorrectMatch = useCallback((matchedValue) => {
            if (matchedValue === question.product) {
                // 正确加分，提示，刷新题目并且增加分数
                setScore(prev => prev + 1);
                setFeedback("🎉 完全正确！ +1分！ 自动刷新下一题 🎉");
                // 自动刷新下一题
                const newQ = generateNewQuestion();
                setQuestion(newQ);
                // 清空放置区高亮样式
                if (dropZoneRef.current) {
                    dropZoneRef.current.classList.remove('drop-zone-active');
                }
                // 震动反馈(小彩蛋)
            } else {
                setFeedback(`❌ 哎呀不对！ ${matchedValue} 不是正确答案。再试试看！记住末尾添0魔法~`);
            }
        }, [question.product]);
        
        // 全局拖拽系统 (指针事件统一处理 移动端+pc)
        useEffect(() => {
            // 获取放置区dom
            const dropZoneElem = document.getElementById('magicDropZone');
            if (dropZoneElem) dropZoneRef.current = dropZoneElem;
            
            // 全局拖拽开始, 委托监听drag-card
            const onPointerDown = (e) => {
                const dragCard = e.target.closest('.drag-card');
                if (!dragCard) return;
                if (isDraggingNow.current) return;
                e.preventDefault();
                // 记录拖拽元素和数值
                const value = parseInt(dragCard.getAttribute('data-value'), 10);
                if (isNaN(value)) return;
                
                dragSourceRef.current = dragCard;
                dragValueRef.current = value;
                // 计算偏移量 (鼠标相对于卡片左上)
                const rect = dragCard.getBoundingClientRect();
                const clientX = e.clientX ?? (e.touches ? e.touches[0].clientX : 0);
                const clientY = e.clientY ?? (e.touches ? e.touches[0].clientY : 0);
                startOffsetX.current = clientX - rect.left;
                startOffsetY.current = clientY - rect.top;
                
                // 创建克隆体
                const clone = dragCard.cloneNode(true);
                clone.style.position = 'fixed';
                clone.style.left = `${rect.left}px`;
                clone.style.top = `${rect.top}px`;
                clone.style.width = `${rect.width}px`;
                clone.style.margin = '0';
                clone.style.zIndex = '9999';
                clone.style.opacity = '0.9';
                clone.style.pointerEvents = 'none';
                clone.style.filter = 'drop-shadow(0 8px 16px rgba(0,0,0,0.2))';
                clone.classList.add('dragging-clone');
                document.body.appendChild(clone);
                dragCloneRef.current = clone;
                
                // 隐藏原始卡片
                dragCard.style.opacity = '0';
                dragCard.style.visibility = 'hidden';
                isDraggingNow.current = true;
                
                // 添加全局移动/结束事件
                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
                // 移动端确保touchmove不滚动页面
                window.addEventListener('touchmove', preventScroll, { passive: false });
            };
            
            const preventScroll = (e) => {
                if (isDraggingNow.current) e.preventDefault();
            };
            
            const onPointerMove = (e) => {
                if (!isDraggingNow.current || !dragCloneRef.current) return;
                e.preventDefault();
                const clientX = e.clientX ?? (e.touches ? e.touches[0].clientX : 0);
                const clientY = e.clientY ?? (e.touches ? e.touches[0].clientY : 0);
                let left = clientX - startOffsetX.current;
                let top = clientY - startOffsetY.current;
                dragCloneRef.current.style.left = `${left}px`;
                dragCloneRef.current.style.top = `${top}px`;
                
                // 高亮放置区效果
                const dropZone = document.getElementById('magicDropZone');
                if (dropZone) {
                    const rectZone = dropZone.getBoundingClientRect();
                    if (clientX >= rectZone.left && clientX <= rectZone.right && clientY >= rectZone.top && clientY <= rectZone.bottom) {
                        dropZone.classList.add('drop-zone-active');
                    } else {
                        dropZone.classList.remove('drop-zone-active');
                    }
                }
            };
            
            const onPointerUp = (e) => {
                if (!isDraggingNow.current) {
                    cleanupDrag();
                    return;
                }
                e.preventDefault();
                const clientX = e.clientX ?? (e.changedTouches ? e.changedTouches[0].clientX : 0);
                const clientY = e.clientY ?? (e.changedTouches ? e.changedTouches[0].clientY : 0);
                const dropZone = document.getElementById('magicDropZone');
                let isMatched = false;
                if (dropZone) {
                    const rectZone = dropZone.getBoundingClientRect();
                    const inside = (clientX >= rectZone.left && clientX <= rectZone.right && clientY >= rectZone.top && clientY <= rectZone.bottom);
                    if (inside && dragValueRef.current !== null) {
                        // 判断配对数值是否正确
                        const droppedValue = dragValueRef.current;
                        if (droppedValue === question.product) {
                            // 正确配对
                            isMatched = true;
                            handleCorrectMatch(droppedValue);
                        } else {
                            setFeedback(`🧸 哎哟，${droppedValue} 不是正确答案噢！ 再试试末尾0的魔法叭~`);
                            isMatched = false;
                        }
                    }
                }
                // 恢复原始卡片显示
                if (dragSourceRef.current) {
                    dragSourceRef.current.style.opacity = '1';
                    dragSourceRef.current.style.visibility = 'visible';
                }
                // 移除克隆体
                cleanupDrag();
                // 移除高亮
                if (dropZone) dropZone.classList.remove('drop-zone-active');
                // 额外: 如果配对正确, 题目已经刷新，答案选项会自动重新生成，无需额外动作；如果错误则题目不变。
                // 清理状态
                isDraggingNow.current = false;
                dragSourceRef.current = null;
                dragValueRef.current = null;
            };
            
            const cleanupDrag = () => {
                if (dragCloneRef.current) {
                    dragCloneRef.current.remove();
                    dragCloneRef.current = null;
                }
                window.removeEventListener('pointermove', onPointerMove);
                window.removeEventListener('pointerup', onPointerUp);
                window.removeEventListener('touchmove', preventScroll);
            };
            
            // 监听全局的卡片拖拽启动
            document.body.addEventListener('pointerdown', onPointerDown);
            return () => {
                document.body.removeEventListener('pointerdown', onPointerDown);
                cleanupDrag();
            };
        }, [question, handleCorrectMatch]);
        
        // “换一题”手动刷新
        const handleNewQuestion = () => {
            refreshQuestion();
        };
        
        // 切换竖式/横式
        const toggleFormat = () => {
            setShowFormat(prev => prev === 'horizontal' ? 'vertical' : 'horizontal');
        };
        
        // 知识点简易组件
        const KnowledgePanel = () => (
            <div className="glass-card p-5 md:p-6 h-full">
                <div className="flex items-center gap-3 mb-4">
                    <svg className="w-8 h-8 text-blue-600" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                    </svg>
                    <h2 className="text-2xl md:text-3xl font-extrabold text-blue-800">✨ 末尾0乘法口诀 ✨</h2>
                </div>
                <div className="bg-white/40 rounded-2xl p-4 mb-4 backdrop-blur-sm">
                    <p className="text-lg font-semibold text-indigo-900">📖 魔法法则：</p>
                    <p className="mt-2 text-gray-800">1️⃣ 先忽略因数末尾的“0”，计算0前面的数字相乘。</p>
                    <p className="mt-1 text-gray-800">2️⃣ 数一数两个因数末尾一共有几个“0”。</p>
                    <p className="mt-1 text-gray-800">3️⃣ 在第一步的乘积末尾添上同样个数的“0”。</p>
                    <div className="bg-blue-100/70 rounded-xl p-3 mt-3 text-center text-blue-900 font-mono text-xl">
                        🌟 20 × 30 = (2×3) 后面加两个0 → 600
                    </div>
                </div>
                <div className="bg-white/30 rounded-2xl p-4">
                    <p className="font-bold text-purple-800">🎯 例子 </p>
                    <p>40 × 50 → 4×5=20 → 添两个0 → 2000</p>
                    <p>60 × 70 → 6×7=42 → 添两个0 → 4200</p>
                    <p className="mt-2 text-sm text-pink-700">⭐ 右侧游戏：将正确的积拖拽进蓝色魔法框中！</p>
                </div>
                <div className="mt-5 text-xs text-center text-gray-600">💡 每配对正确+1分，自动接下一题～</div>
            </div>
        );
        
        // 右侧游戏UI
        const GamePanel = () => (
            <div className="glass-card p-5 md:p-6 flex flex-col h-full">
                {/* 游戏头部工具栏 */}
                <div className="flex flex-wrap justify-between items-center gap-3 border-b border-white/40 pb-3 mb-4">
                    <div className="flex items-center gap-3">
                        <svg className="w-7 h-7 text-yellow-600" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                        </svg>
                        <span className="text-xl font-bold text-indigo-800">得分: {score}</span>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={handleNewQuestion} className="bg-gradient-to-r from-cyan-400 to-blue-400 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-2 px-4 rounded-full shadow-md transition flex items-center gap-1 btn-shine">
                            <svg className="w-5 h-5 inline" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clipRule="evenodd"/></svg>
                            换一题
                        </button>
                        <button onClick={toggleFormat} className="bg-gradient-to-r from-purple-400 to-pink-400 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-2 px-4 rounded-full shadow-md flex items-center gap-1 btn-shine">
                            <svg className="w-5 h-5 inline" viewBox="0 0 20 20" fill="currentColor"><path d="M5 3a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2V5a2 2 0 00-2-2H5zm0 2h10v10H5V5z"/><path d="M7 7h6v2H7V7zm0 4h6v2H7v-2z"/></svg>
                            {showFormat === 'horizontal' ? '📐 竖式' : '➡️ 横式'}
                        </button>
                    </div>
                </div>
                
                {/* 题目卡片与展示区 */}
                <div className="bg-white/40 backdrop-blur-sm rounded-2xl p-4 mb-5 text-center">
                    <div className="text-3xl md:text-5xl font-black text-blue-800 tracking-wide">
                        {question.num1} × {question.num2} = ?
                    </div>
                    {/* 竖式/横式说明区域 */}
                    <div className="mt-4 p-3 bg-indigo-50/60 rounded-xl text-left font-mono text-sm md:text-base">
                        {showFormat === 'horizontal' ? (
                            <div className="text-blue-900">
                                🧙 横式速算：<br/>
                                <span className="font-bold">{question.num1} × {question.num2}</span> = ({question.num1/10}×{question.num2/10}) × 100 <br/>
                                = { (question.num1/10) * (question.num2/10) } × 100 = <span className="text-pink-700 text-xl font-extrabold">{question.product}</span>
                            </div>
                        ) : (
                            <div className="text-blue-900 whitespace-pre-wrap font-mono">
                                📚 竖式小妙招：<br/>
                                <div className="bg-white/40 p-2 rounded inline-block">
                                    {question.num1}<br/>
                                    × {question.num2}<br/>
                                    ——————<br/>
                                    {(question.num1/10) * (question.num2/10)} {'0'.repeat((question.num1.toString().split('0').length-1)+(question.num2.toString().split('0').length-1))}<br/>
                                    ——————<br/>
                                    {question.product}
                                </div>
                                <div className="text-xs mt-2">✨ 先算 {question.num1/10}×{question.num2/10}，再补上末尾的{ (question.num1.toString().split('0').length-1)+(question.num2.toString().split('0').length-1) }个0 ✨</div>
                            </div>
                        )}
                    </div>
                </div>
                
                {/* 魔法放置区 (拖拽目标) */}
                <div id="magicDropZone" className="bg-blue-100/60 backdrop-blur-sm rounded-2xl p-5 mb-6 border-4 border-dashed border-blue-300 transition-all text-center drop-zone-custom">
                    <div className="flex justify-center items-center gap-2 text-blue-800 font-bold">
                        <svg className="w-8 h-8 text-blue-600" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zm0 14a6 6 0 110-12 6 6 0 010 12z"/><path d="M10 6a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H7a1 1 0 110-2h3V7a1 1 0 011-1z"/></svg>
                        <span className="text-2xl">魔法收纳篮</span>
                    </div>
                    <p className="text-md text-gray-700 mt-1">⬅️ 将正确的积拖拽到此处 ➡️</p>
                    <div className="text-sm text-indigo-700 mt-2 bg-white/40 rounded-full py-1 px-2 inline-block">当前目标积: ?</div>
                </div>
                
                {/* 可拖拽答案卡片区 */}
                <div className="mt-2">
                    <p className="text-md font-bold text-indigo-800 flex items-center gap-2"><svg className="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z"/></svg> 拖动彩色卡片到上方蓝色区域</p>
                    <div className="flex flex-wrap justify-center gap-4 mt-3">
                        {answerOptions.map((opt, idx) => (
                            <div key={idx} data-value={opt} className="drag-card bg-gradient-to-br from-amber-200 to-rose-200 rounded-full px-6 py-3 shadow-lg text-2xl font-black text-purple-900 text-center min-w-[100px] hover:scale-105 transition-transform cursor-grab">
                                {opt}
                            </div>
                        ))}
                    </div>
                </div>
                
                {/* 反馈消息 */}
                <div className={`mt-5 rounded-xl p-3 text-center font-semibold transition-all ${feedback.includes('正确') ? 'bg-green-200 text-green-800' : feedback.includes('哎呀') ? 'bg-red-200 text-red-800' : 'bg-yellow-100/70 text-amber-800'}`}>
                    {feedback}
                </div>
                <div className="text-xs text-center text-gray-500 mt-2">⭐ 提示：按住卡片拖拽，放到魔法篮子上方松手 ⭐</div>
            </div>
        );
        
        return (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-stretch">
                <div className="h-full">
                    <KnowledgePanel />
                </div>
                <div className="h-full">
                    <GamePanel />
                </div>
            </div>
        );
    };
