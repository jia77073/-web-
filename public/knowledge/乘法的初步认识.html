<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>乘法小精灵 | 玻璃蓝乘法乐园</title>
    <!-- Tailwind CSS + Google Fonts (可爱风格) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM & Babel CDN -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <style>
        /* 额外圆角和玻璃蓝效果, 自定义拖拽无延迟 */
        body {
            background: linear-gradient(135deg, #b8e1fc 0%, #c1dff7 40%, #d9effa 100%);
            font-family: 'Segoe UI', 'Comic Neue', 'Chalkboard SE', 'Comic Sans MS', 'cursive', system-ui;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255,255,240,0.3);
            border-radius: 20px;
        }
        ::-webkit-scrollbar-thumb {
            background: #78b9e2;
            border-radius: 20px;
        }
        @keyframes floatSoft {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }
        .hover-float:hover {
            animation: floatSoft 0.6s ease-in-out;
        }
        /* 拖拽克隆体样式 - 完全跟随手指/鼠标 */
        .drag-clone-custom {
            position: fixed;
            z-index: 9999;
            filter: drop-shadow(0 12px 20px rgba(0,0,0,0.25));
            opacity: 0.88;
            pointer-events: none;
            transform: scale(1.05) rotate(2deg);
            transition: none;
            background: #FFF3CC;
            border-radius: 999px;
            padding: 14px 24px;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            color: #3A6B35;
            border: 3px solid #FFD966;
            white-space: nowrap;
            font-family: inherit;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            width: auto;
            min-width: 90px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.2);
        }
        /* 放置区高亮 */
        .dropzone-highlight {
            background: #c7e2ff !important;
            transform: scale(1.01);
            border-color: #ffb347 !important;
            transition: all 0.08s linear;
        }
        .dropzone-error {
            background: #ffcdd4 !important;
            transition: all 0.1s;
        }
        /* 确保卡片禁用拖拽时不可选 */
        .drag-card-item {
            touch-action: none;
            user-select: none;
            cursor: grab;
        }
        .drag-card-item:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="p-4 md:p-6 min-h-screen flex items-center justify-center">

<div id="root" class="w-full max-w-6xl mx-auto"></div>

<script type="text/babel">
    // 乘法小游戏 —— 完全自定义拖拽 (流畅触摸+鼠标)
    // 知识点讲解区 + 自定义拖拽配对游戏
    const { useState, useRef, useEffect, useCallback } = React;

    // 辅助: 随机整数
    const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    
    // 生成新题目: 返回 { a, b, correct, options }
    const generateNewQuiz = () => {
        const a = randomInt(1, 9);
        const b = randomInt(1, 9);
        const correct = a * b;
        let opt1 = correct, opt2 = correct;
        while (opt1 === correct) opt1 = randomInt(Math.max(1, correct - 5), Math.min(81, correct + 5));
        while (opt2 === correct || opt2 === opt1) opt2 = randomInt(Math.max(1, correct - 8), Math.min(81, correct + 8));
        let options = [correct, opt1, opt2];
        for (let i = options.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [options[i], options[j]] = [options[j], options[i]];
        }
        return { a, b, correct, options };
    };

    // 知识点组件 (左边)
    const KnowledgePanel = () => {
        return (
            <div className="bg-white/40 backdrop-blur-xl rounded-3xl shadow-2xl p-5 md:p-6 border border-white/40 transition-all hover:shadow-xl h-full">
                <div className="flex items-center gap-2 mb-4">
                    <svg className="w-7 h-7 md:w-8 md:h-8 text-indigo-700" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 6C4 4.89543 4.89543 4 6 4H18C19.1046 4 20 4.89543 20 6V18C20 19.1046 19.1046 20 18 20H6C4.89543 20 4 19.1046 4 18V6Z" stroke="currentColor" strokeWidth="1.5" fill="#FFF5E6" strokeLinecap="round"/>
                        <path d="M8 7H16M8 11H14M8 15H12" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/>
                        <path d="M19 6L5 6" stroke="currentColor" strokeWidth="1.5" strokeDasharray="2 2"/>
                    </svg>
                    <h2 className="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-700 to-cyan-700">乘法小课堂</h2>
                </div>
                <div className="space-y-3 text-indigo-900/80 text-base md:text-lg font-medium">
                    <p className="bg-white/50 rounded-2xl p-3 backdrop-blur-sm">✨ <strong>乘法是什么？</strong><br/>求几个相同加数和的简便运算～<br/>比如：<span className="bg-amber-100 px-2 py-1 rounded-full">2+2+2 = 6</span> 就是 <span className="bg-amber-100 px-2 py-1 rounded-full">2 × 3 = 6</span></p>
                    <p className="bg-white/50 rounded-2xl p-3 backdrop-blur-sm">🧸 <strong>乘法口诀小帮手</strong><br/>2×3=6 &nbsp; 1×5=5 &nbsp; 2×4=8<br/>“几个几” 用乘法超方便！</p>
                    <div className="bg-gradient-to-r from-sky-100 to-blue-100 rounded-2xl p-3 border border-sky-200">
                        <div className="flex gap-2 items-center">
                            <span className="text-2xl">💡</span>
                            <span>按住数字卡片拖到✨答题盘✨，配对正确自动换题！超流畅拖拽~</span>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    // 游戏主组件 - 完全自定义拖拽实现
    const GameZone = () => {
        const [quiz, setQuiz] = useState(() => generateNewQuiz());
        const [score, setScore] = useState(0);
        const [feedbackMsg, setFeedbackMsg] = useState("🐣 按住数字卡片，拖到发光答题盘～");
        const [isVertical, setIsVertical] = useState(false);
        const [dragDisabled, setDragDisabled] = useState(false);
        
        // 拖拽相关 state
        const dragState = useRef({
            isDragging: false,
            startX: 0,
            startY: 0,
            currentCardValue: null,
            cloneElement: null,
            activeCardElement: null,
            pointerId: null
        });
        
        const dropZoneRef = useRef(null);
        const feedbackTimeout = useRef(null);
        
        // 显示反馈
        const showToast = (msg, isError = false) => {
            if (feedbackTimeout.current) clearTimeout(feedbackTimeout.current);
            setFeedbackMsg(msg);
            feedbackTimeout.current = setTimeout(() => {
                if (!isError) setFeedbackMsg("🌟 继续拖拽数字到魔法答题盘吧！");
                else setFeedbackMsg("✨ 再试一次，把正确的数字拖过来~");
            }, 1800);
        };
        
        // 换题 (保留得分)
        const handleNewQuestion = useCallback(() => {
            if (dragDisabled) return;
            const newQuiz = generateNewQuiz();
            setQuiz(newQuiz);
            showToast("🎲 换题啦！试试新乘法算式~", false);
        }, [dragDisabled]);
        
        // 配对正确逻辑
        const handleCorrectMatch = useCallback(() => {
            setScore(prev => prev + 1);
            const newQuiz = generateNewQuiz();
            setQuiz(newQuiz);
            showToast("🎉 配对正确！ +1分 超厉害！ 🎉", false);
        }, []);
        
        // 清理拖拽克隆体和事件
        const cleanupDrag = () => {
            const ds = dragState.current;
            if (ds.cloneElement && ds.cloneElement.parentNode) {
                ds.cloneElement.remove();
            }
            if (ds.activeCardElement) {
                // 解除指针捕获
                if (ds.pointerId !== null && ds.activeCardElement.releasePointerCapture) {
                    try { ds.activeCardElement.releasePointerCapture(ds.pointerId); } catch(e) {}
                }
            }
            // 移除全局事件
            window.removeEventListener('pointermove', onGlobalPointerMove);
            window.removeEventListener('pointerup', onGlobalPointerUp);
            dragState.current = {
                isDragging: false,
                startX: 0,
                startY: 0,
                currentCardValue: null,
                cloneElement: null,
                activeCardElement: null,
                pointerId: null
            };
        };
        
        // 全局移动
        const onGlobalPointerMove = (e) => {
            const ds = dragState.current;
            if (!ds.isDragging || !ds.cloneElement) return;
            e.preventDefault();
            const clientX = e.clientX;
            const clientY = e.clientY;
            // 移动克隆体
            ds.cloneElement.style.left = `${clientX - ds.cloneElement.offsetWidth / 2}px`;
            ds.cloneElement.style.top = `${clientY - ds.cloneElement.offsetHeight / 2}px`;
            
            // 实时高亮放置区 (碰撞检测)
            const dropZone = dropZoneRef.current;
            if (dropZone) {
                const rect = dropZone.getBoundingClientRect();
                if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
                    if (!dropZone.classList.contains('dropzone-highlight')) {
                        dropZone.classList.add('dropzone-highlight');
                    }
                } else {
                    dropZone.classList.remove('dropzone-highlight');
                }
            }
        };
        
        // 全局抬起: 碰撞检测配对
        const onGlobalPointerUp = (e) => {
            const ds = dragState.current;
            if (!ds.isDragging) {
                cleanupDrag();
                return;
            }
            e.preventDefault();
            // 获取结束点坐标
            let clientX = e.clientX;
            let clientY = e.clientY;
            if (e.changedTouches && e.changedTouches.length) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            }
            // 检测是否在放置区内部
            const dropZone = dropZoneRef.current;
            let isOverDropZone = false;
            if (dropZone) {
                const rect = dropZone.getBoundingClientRect();
                if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
                    isOverDropZone = true;
                }
                // 清除高亮
                dropZone.classList.remove('dropzone-highlight');
            }
            
            const draggedValue = ds.currentCardValue;
            if (isOverDropZone && draggedValue !== null && !dragDisabled) {
                const currentCorrect = quiz.correct;
                if (draggedValue === currentCorrect) {
                    // 正确
                    setDragDisabled(true);
                    handleCorrectMatch();
                    setTimeout(() => setDragDisabled(false), 600);
                    // 成功动画: 放置区闪绿
                    if (dropZone) {
                        dropZone.classList.add("bg-green-200/80");
                        setTimeout(() => dropZone.classList.remove("bg-green-200/80"), 300);
                    }
                } else {
                    // 错误
                    showToast(`❌ 不对哦！ ${quiz.a} × ${quiz.b} 不等于 ${draggedValue} ，再试试看～`, true);
                    if (dropZone) {
                        dropZone.classList.add("dropzone-error");
                        setTimeout(() => dropZone.classList.remove("dropzone-error"), 400);
                    }
                }
            } else if (!isOverDropZone && draggedValue !== null) {
                showToast("📦 要把数字卡片拖到发光答题盘里哟！", true);
            }
            // 清理拖拽
            cleanupDrag();
        };
        
        // 卡片按下: 启动拖拽
        const onCardPointerDown = (e, cardValue, cardElement) => {
            if (dragDisabled) {
                e.preventDefault();
                return;
            }
            e.preventDefault();
            e.stopPropagation();
            const pointerId = e.pointerId;
            cardElement.setPointerCapture(pointerId);
            
            // 获取起始坐标
            const startX = e.clientX;
            const startY = e.clientY;
            // 创建克隆体
            const clone = document.createElement('div');
            clone.className = 'drag-clone-custom';
            clone.innerText = cardValue;
            // 设置克隆体初始位置在原卡片位置
            const rect = cardElement.getBoundingClientRect();
            clone.style.left = `${rect.left}px`;
            clone.style.top = `${rect.top}px`;
            clone.style.width = `${rect.width}px`;
            clone.style.height = `${rect.height}px`;
            document.body.appendChild(clone);
            
            // 存储拖拽状态
            dragState.current = {
                isDragging: true,
                startX,
                startY,
                currentCardValue: cardValue,
                cloneElement: clone,
                activeCardElement: cardElement,
                pointerId
            };
            
            // 绑定全局事件
            window.addEventListener('pointermove', onGlobalPointerMove);
            window.addEventListener('pointerup', onGlobalPointerUp);
        };
        
        // 渲染横式/竖式
        const renderMultiplicationFormat = () => {
            const { a, b } = quiz;
            if (!isVertical) {
                return (
                    <div className="text-center">
                        <span className="text-5xl md:text-7xl font-black text-indigo-800 bg-white/40 px-6 py-3 rounded-3xl inline-block shadow-sm backdrop-blur-sm">
                            {a} × {b} = <span className="text-amber-700">?</span>
                        </span>
                    </div>
                );
            } else {
                return (
                    <div className="flex justify-center items-center">
                        <div className="bg-white/40 backdrop-blur-md rounded-3xl p-4 inline-block text-center">
                            <div className="text-5xl md:text-6xl font-black text-indigo-800 tracking-wider">{a}</div>
                            <div className="flex items-center justify-center gap-3 mt-1">
                                <span className="text-4xl font-bold text-indigo-700">×</span>
                                <span className="text-5xl md:text-6xl font-black text-indigo-800">{b}</span>
                            </div>
                            <div className="border-b-4 border-indigo-400 w-full my-2"></div>
                            <div className="text-5xl md:text-6xl font-black text-amber-700 mt-2">?</div>
                        </div>
                    </div>
                );
            }
        };
        
        // 重新生成卡片绑定 (每次quiz变化或重置)
        const { options, a, b } = quiz;
        
        // 确保拖拽结束时清理全局残留（安全）
        useEffect(() => {
            return () => {
                if (dragState.current.isDragging) cleanupDrag();
                if (feedbackTimeout.current) clearTimeout(feedbackTimeout.current);
            };
        }, []);
        
        return (
            <div className="bg-white/30 backdrop-blur-xl rounded-3xl shadow-2xl p-5 md:p-6 border border-white/50 flex flex-col h-full">
                {/* 得分 & 控制栏 */}
                <div className="flex justify-between items-center flex-wrap gap-3 mb-5">
                    <div className="flex items-center gap-2 bg-gradient-to-r from-amber-100 to-orange-100 rounded-full px-5 py-2 shadow-md">
                        <svg className="w-6 h-6 text-orange-600" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L15 8.5L22 9.5L17 14L18.5 21L12 17.5L5.5 21L7 14L2 9.5L9 8.5L12 2Z" fill="#FBBF24" stroke="#D97706" strokeWidth="1.2"/>
                        </svg>
                        <span className="font-bold text-lg text-amber-800">匹配得分: <span className="text-2xl font-extrabold">{score}</span></span>
                    </div>
                    <div className="flex gap-3">
                        <button 
                            onClick={() => setIsVertical(!isVertical)}
                            className="bg-white/70 backdrop-blur rounded-full px-4 py-2 flex items-center gap-2 shadow-md hover:bg-white transition text-indigo-700 font-bold border border-indigo-200"
                        >
                            <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M4 6H20M8 12H16M6 18H18" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
                                <path d="M12 4L12 20" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
                            </svg>
                            {isVertical ? "📐 切换横式" : "📏 切换竖式"}
                        </button>
                        <button 
                            onClick={handleNewQuestion}
                            className="bg-gradient-to-r from-sky-400 to-blue-500 text-white rounded-full px-5 py-2 flex items-center gap-2 shadow-lg hover:scale-105 transition font-bold"
                        >
                            <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M1 12C1 5.92487 5.92487 1 12 1C18.0751 1 23 5.92487 23 12C23 18.0751 18.0751 23 12 23" stroke="white" strokeWidth="2" strokeLinecap="round"/>
                                <path d="M19 12L23 16L19 20" stroke="white" strokeWidth="2" strokeLinecap="round"/>
                                <path d="M5 12L1 16L5 20" stroke="white" strokeWidth="2" strokeLinecap="round"/>
                            </svg>
                            换一题
                        </button>
                    </div>
                </div>
                
                {/* 算式展示区 */}
                <div className="my-4 p-3 bg-indigo-50/50 rounded-3xl">
                    {renderMultiplicationFormat()}
                </div>
                
                {/* 放置区 (魔法答题盘) */}
                <div 
                    ref={dropZoneRef}
                    className="bg-gradient-to-br from-indigo-100/80 to-purple-100/80 backdrop-blur-sm border-4 border-dashed border-indigo-300 rounded-3xl p-6 mt-3 text-center transition-all duration-75 cursor-grab"
                >
                    <div className="flex flex-col items-center pointer-events-none">
                        <svg className="w-12 h-12 text-indigo-500 mb-1" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L15 8.5L22 9.5L17 14L18.5 21L12 17.5L5.5 21L7 14L2 9.5L9 8.5L12 2Z" fill="#FDE68A" stroke="#D97706" strokeWidth="1.2"/>
                            <circle cx="12" cy="12" r="2" fill="#F59E0B" />
                        </svg>
                        <span className="text-indigo-800 font-bold text-xl md:text-2xl">✨ 魔法答题盘 ✨</span>
                        <span className="text-indigo-600 text-sm mt-1">把正确答案的数字卡片拖到这里！</span>
                    </div>
                </div>
                
                {/* 可拖拽卡片区域 - 使用自定义指针事件 */}
                <div className="mt-8">
                    <p className="text-center text-indigo-800 font-semibold mb-3 flex items-center justify-center gap-1">
                        <span>👇 按住数字卡片拖到上方发光区域 👇</span> 
                    </p>
                    <div className="flex flex-wrap justify-center gap-4 md:gap-6">
                        {options.map((opt, idx) => {
                            // 使用data-value存储，并通过ref获取dom
                            return (
                                <div
                                    key={idx}
                                    data-value={opt}
                                    className="drag-card-item bg-amber-100 hover:bg-amber-200 rounded-full w-24 h-24 md:w-28 md:h-28 flex items-center justify-center shadow-xl transition-all hover:scale-110 border-4 border-white/80 backdrop-blur-sm select-none"
                                    onPointerDown={(e) => {
                                        const targetCard = e.currentTarget;
                                        if (dragDisabled) return;
                                        onCardPointerDown(e, opt, targetCard);
                                    }}
                                    style={{ touchAction: 'none' }}
                                >
                                    <span className="text-4xl md:text-5xl font-black text-amber-700">{opt}</span>
                                </div>
                            );
                        })}
                    </div>
                </div>
                
                {/* 反馈区域 */}
                <div className={`mt-6 p-3 rounded-2xl text-center font-bold transition-all ${
                    feedbackMsg.includes('正确') ? 'bg-emerald-100 text-emerald-700' : 
                    (feedbackMsg.includes('哎呀') || feedbackMsg.includes('不对') ? 'bg-rose-100 text-rose-700' : 'bg-indigo-50 text-indigo-700')
                }`}>
                    <div className="flex items-center justify-center gap-2">
                        {feedbackMsg.includes('正确') && <span>🏆</span>}
                        {feedbackMsg.includes('哎呀') && <span>🤔</span>}
                        <span className="text-sm md:text-base">{feedbackMsg}</span>
                    </div>
                </div>
                
                <div className="text-xs text-center text-indigo-500/70 mt-4">
                    💡 超灵活拖拽体验: 按住数字卡片，滑动到发光盘即可配对～
                </div>
            </div>
        );
    };
    
    // 主应用
    const App = () => {
        return (
            <div className="flex flex-col md:flex-row gap-6 md:gap-8 p-2">
                <div className="md:w-2/5 w-full">
                    <KnowledgePanel />
                </div>
                <div className="md:w-3/5 w-full">
                    <GameZone />
                </div>
            </div>
        );
    };
    
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
